<a
  [routerLink]="['/', AppPath.Recipes, recipe().id]"
  class="text-charcoal flex min-w-0 flex-1 items-center gap-1 font-semibold"
>
  <span class="min-w-0 flex-1">
    <span class="block truncate">{{ recipe().name }}</span>
    <span
      class="font-mono mt-1 block min-h-4 text-[11px]/4 font-medium"
      [class.text-tomato]="recipe().inMealsList"
      [class.text-charcoal/40]="!recipe().inMealsList"
    >
      @if (recipe().inMealsList) {
        Repas planifié
      } @else {
        Repas non planifié
      }
    </span>
  </span>
  <span class="material-symbols-outlined text-charcoal/40 text-lg">chevron_right</span>
</a>
