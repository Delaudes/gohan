@if (ingredient().isLoadingUpdating) {
  <div class="flex h-11 w-11 shrink-0 items-center justify-center">
    <span class="material-symbols-outlined text-tomato animate-spin">progress_activity</span>
  </div>
} @else {
  <button
    type="button"
    (click)="updateIngredientShoppingList.execute(ingredient().id, !ingredient().inShoppingList)"
    [attr.aria-label]="ingredient().inShoppingList ? 'Retirer de la liste de courses' : 'Ajouter à la liste de courses'"
    class="flex h-11 w-11 shrink-0 items-center justify-center"
    [class.text-tomato]="ingredient().inShoppingList"
    [class.text-charcoal/40]="!ingredient().inShoppingList"
  >
    <span class="material-symbols-outlined text-xl">{{ ingredient().inShoppingList ? 'check_box' : 'check_box_outline_blank' }}</span>
  </button>
}
