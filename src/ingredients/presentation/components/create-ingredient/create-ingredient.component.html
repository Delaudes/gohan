<button
  type="button"
  (click)="dialog.showModal()"
  aria-label="Ajouter un ingrédient"
  class="bg-nori text-yuzu hover:bg-nori/90 fixed right-4 bottom-20 z-10 flex h-14 w-14 items-center justify-center rounded-full shadow-lg transition-colors"
>
  <span class="material-symbols-outlined text-2xl">add</span>
</button>

<dialog #dialog class="bg-rice-white m-auto w-[min(90vw,22rem)] rounded-2xl p-6 backdrop:bg-nori/50">
  @let vm = viewModel.get();
  <div class="flex flex-col items-center gap-3 text-center">
    <p class="text-nori">Nouvel ingrédient</p>
    <input
      #nameInput
      type="text"
      placeholder="Nom de l'ingrédient"
      class="border-soy/30 text-nori placeholder:text-soy/60 focus:border-nori w-full rounded-full border px-4 py-2 text-center outline-none"
    />
    @if (vm.isErrorCreatingIngredient) {
      <p class="text-danger text-sm">Une erreur est survenue, réessayez.</p>
    }
    @if (vm.isLoadingCreatingIngredient) {
      <div class="flex h-11 w-full items-center justify-center">
        <span class="material-symbols-outlined text-nori animate-spin">progress_activity</span>
      </div>
    } @else {
      <div class="flex h-11 w-full justify-center gap-2">
        <button
          type="button"
          (click)="dialog.close()"
          class="border-soy/30 text-soy hover:bg-soy/10 flex-1 rounded-full border transition-colors"
        >Annuler</button>
        <button
          type="button"
          (click)="createIngredient.execute(dialog, nameInput)"
          class="bg-nori text-yuzu hover:bg-nori/90 flex-1 rounded-full transition-colors"
        >Ajouter</button>
      </div>
    }
  </div>
</dialog>
