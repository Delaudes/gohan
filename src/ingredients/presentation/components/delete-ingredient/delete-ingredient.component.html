<button
  type="button"
  (click)="dialog.showModal()"
  aria-label="Supprimer l'ingrédient"
  class="text-soy hover:bg-soy/10 flex h-9 w-9 shrink-0 items-center justify-center rounded-full transition-colors"
>
  <span class="material-symbols-outlined text-xl">delete</span>
</button>

<dialog #dialog class="bg-rice-white m-auto w-[min(90vw,22rem)] rounded-2xl p-6 backdrop:bg-nori/50">
  <div class="flex flex-col items-center gap-3 text-center">
    <span class="material-symbols-outlined text-danger text-3xl">warning</span>
    <p class="text-nori">Voulez-vous vraiment supprimer cet ingrédient ? Cette action est irréversible.</p>
    @if (ingredient().isErrorDeleting) {
      <p class="text-danger text-sm">Une erreur est survenue, réessayez.</p>
    }
    @if (ingredient().isLoadingDeleting) {
      <div class="flex h-11 w-full items-center justify-center">
        <span class="material-symbols-outlined text-nori animate-spin">progress_activity</span>
      </div>
    } @else {
      <div class="flex h-11 w-full justify-center gap-2">
        <button
          type="button"
          (click)="dialog.close()"
          class="border-soy/30 text-soy hover:bg-soy/10 flex-1 rounded-full border transition-colors"
        >Annuler</button>
        <button
          type="button"
          (click)="deleteIngredient.execute(ingredient().id, dialog)"
          class="bg-nori text-yuzu hover:bg-nori/90 flex-1 rounded-full transition-colors"
        >Supprimer</button>
      </div>
    }
  </div>
</dialog>
