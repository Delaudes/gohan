@if (recipe().isLoadingUpdating) {
  <div class="flex h-11 w-11 shrink-0 items-center justify-center">
    <span class="material-symbols-outlined text-tomato animate-spin">progress_activity</span>
  </div>
} @else {
  <button
    type="button"
    (click)="updateRecipeMealsList.execute(recipe().id, !recipe().inMealsList)"
    [attr.aria-label]="recipe().inMealsList ? 'Retirer des repas' : 'Ajouter aux repas'"
    class="flex h-11 w-11 shrink-0 items-center justify-center"
    [class.text-tomato]="recipe().inMealsList"
    [class.text-charcoal/40]="!recipe().inMealsList"
  >
    <span class="material-symbols-outlined text-xl">{{ recipe().inMealsList ? 'check_box' : 'check_box_outline_blank' }}</span>
  </button>
}
